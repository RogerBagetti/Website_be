<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartão de avaliação — Betina Bernardi Boff</title>
<link rel="icon" type="image/png" href="brand/Logo_ber.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --cream:#F7F1E8; --sand:#EADFCE; --gold:#B4966A; --golden:#C8AE82;
    --wine:#5C2335; --winedeep:#3F1825; --ink:#2C2620; --muted:#7B6F61;
    --serif:"Cormorant Garamond",serif; --sans:"Jost",sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:var(--sans); color:var(--ink); background:#cbb9a8; padding:28px 16px;
    display:flex; flex-direction:column; align-items:center; gap:18px; }

  /* ---------- A4 SHEET with wallet-size cards ---------- */
  .sheet{
    width:210mm; min-height:297mm; background:#fff; padding:12mm 12mm;
    display:grid; grid-template-columns:repeat(2, 85mm); grid-auto-rows:54mm;
    gap:4mm; justify-content:center; align-content:start;
    box-shadow:0 30px 70px -30px rgba(63,24,37,.5);
  }

  /* ---------- WALLET CARD (85.6 x 54 mm) ---------- */
  .card{
    position:relative; width:85mm; height:54mm; overflow:hidden; background:var(--cream);
    border:.3mm solid rgba(180,150,106,.45); border-radius:3mm;
    display:flex; -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .card::before{ content:""; position:absolute; width:34mm; height:34mm; border-radius:50%;
    top:-16mm; left:-12mm; background:radial-gradient(circle, rgba(200,174,130,.5), transparent 70%); }

  .card .left{ position:relative; z-index:1; flex:1; padding:4.2mm 3mm 3.2mm 4.5mm;
    display:flex; flex-direction:column; }
  .brand{ display:flex; align-items:center; gap:1.8mm; }
  .brand img{ width:7.6mm; height:7.6mm; border-radius:50%; object-fit:cover; }
  .brand .name{ font-family:var(--serif); font-size:3.7mm; line-height:1; letter-spacing:-.02em; color:var(--ink); }
  .brand .sub{ font-size:1.5mm; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin-top:.6mm; }

  .eyebrow{ margin-top:3.2mm; font-size:1.7mm; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); }
  .headline{ font-family:var(--serif); font-style:italic; font-weight:500; color:var(--wine);
    font-size:6mm; line-height:1.02; letter-spacing:-.01em; margin-top:1mm; }
  .stars{ margin-top:1.8mm; color:var(--golden); letter-spacing:.6mm; font-size:3.1mm; }
  .foot{ margin-top:auto; font-size:1.95mm; color:var(--muted); }
  .foot .site{ color:var(--wine); }

  .card .right{ position:relative; z-index:1; width:34mm; flex:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4mm;
    padding:3mm 3mm 3mm 0; }
  .qr{ width:28mm; height:28mm; padding:1.6mm; background:#fff; border:.3mm solid rgba(180,150,106,.4);
    border-radius:2mm; box-shadow:0 3px 8px -4px rgba(63,24,37,.3); }
  .qr img{ width:100%; height:100%; display:block; }
  .qr-label{ display:flex; align-items:center; gap:1mm; font-size:1.7mm; color:var(--ink); text-align:center; line-height:1.1; }
  .qr-label svg{ width:2.6mm; height:2.6mm; color:var(--wine); flex:none; }

  /* ---------- screen controls ---------- */
  .toolbar{ display:flex; gap:12px; }
  .btn{ font-family:var(--sans); font-size:14px; color:#fff; background:var(--wine); border:none;
    border-radius:999px; padding:12px 26px; cursor:pointer; box-shadow:0 10px 24px -12px rgba(63,24,37,.6);
    transition:transform .25s ease, background .25s ease; }
  .btn:hover{ transform:translateY(-2px); background:var(--winedeep); }
  .hint{ font-size:12.5px; color:#4a3d33; max-width:210mm; text-align:center; line-height:1.7; }
  .hint b{ color:#3F1825; }

  /* ---------- PRINT ---------- */
  @page{ size:A4 portrait; margin:0; }
  @media print{
    body{ background:#fff; padding:0; gap:0; }
    .no-print{ display:none !important; }
    .sheet{ box-shadow:none; margin:0; }
  }
</style>
</head>
<body>

  <div class="sheet" id="sheet"></div>

  <div class="toolbar no-print">
    <button class="btn" onclick="window.print()">Imprimir folha</button>
  </div>
  <p class="hint no-print">
    São <b>10 cartões</b> tamanho carteira (8,5 × 5,4 cm) numa folha <b>A4</b> — é só imprimir e recortar.<br/>
    Ao imprimir: <b>Escala 100%</b> (não “ajustar à página”), <b>margens: nenhuma</b> e ative <b>“Gráficos de plano de fundo”</b>.
  </p>

  <script>
    const card = `
      <div class="card">
        <div class="left">
          <div class="brand">
            <img src="brand/Logo_ber.png" alt="" />
            <div>
              <div class="name">Betina Bernardi Boff</div>
              <div class="sub">Odontologia</div>
            </div>
          </div>
          <div class="eyebrow">Avalie seu atendimento</div>
          <div class="headline">Como foi a sua<br/>experiência?</div>
          <div class="stars">★★★★★</div>
          <div class="foot"><span class="site">betinaboff.com</span> · CRO-SC 25849</div>
        </div>
        <div class="right">
          <div class="qr"><img src="qr-code/qr-avaliacao-vinho.svg" alt="QR para avaliar" /></div>
          <div class="qr-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Aponte a câmera
          </div>
        </div>
      </div>`;
    document.getElementById('sheet').innerHTML = card.repeat(10);
  </script>
</body>
</html>
