<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartão de contato — Betina Bernardi Boff</title>
<link rel="icon" type="image/png" href="brand/Logo_ber.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --cream:#F7F1E8; --sand:#EADFCE; --gold:#B4966A; --golden:#C8AE82;
    --wine:#5C2335; --winedeep:#3F1825; --ink:#2C2620; --muted:#7B6F61;
    --serif:"Cormorant Garamond",serif; --sans:"Jost",sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:var(--sans); color:var(--ink); background:#cbb9a8; padding:28px 16px;
    display:flex; flex-direction:column; align-items:center; gap:18px; }

  .sheet{
    width:210mm; min-height:297mm; background:#fff; padding:12mm 12mm;
    display:grid; grid-template-columns:repeat(2, 85mm); grid-auto-rows:54mm;
    gap:4mm; justify-content:center; align-content:start;
    box-shadow:0 30px 70px -30px rgba(63,24,37,.5);
  }

  /* ---------- WALLET CARD (85.6 x 54 mm) ---------- */
  .card{
    position:relative; width:85mm; height:54mm; overflow:hidden; background:var(--cream);
    border:.3mm solid rgba(180,150,106,.45); border-radius:3mm;
    display:flex; -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .card::before{ content:""; position:absolute; width:36mm; height:36mm; border-radius:50%;
    top:-17mm; right:-13mm; background:radial-gradient(circle, rgba(200,174,130,.5), transparent 70%); }
  .card::after{ content:""; position:absolute; width:30mm; height:30mm; border-radius:50%;
    bottom:-15mm; left:-12mm; background:radial-gradient(circle, rgba(92,35,53,.14), transparent 70%); }

  .left{ position:relative; z-index:1; flex:1; padding:4.4mm 2.5mm 3.6mm 4.6mm; display:flex; flex-direction:column; }
  .brand{ display:flex; align-items:center; gap:2mm; }
  .brand img{ width:9mm; height:9mm; border-radius:50%; object-fit:cover; }
  .brand .name{ font-family:var(--serif); font-size:4.2mm; line-height:1; letter-spacing:-.02em; color:var(--ink); }
  .brand .role{ font-size:1.55mm; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); margin-top:.8mm; }

  .rule{ height:.25mm; background:linear-gradient(90deg, rgba(180,150,106,.6), transparent); margin:3mm 0 2.6mm; width:42mm; }

  .contacts{ display:flex; flex-direction:column; gap:1.7mm; }
  .row{ display:flex; align-items:center; gap:1.9mm; font-size:2.15mm; font-weight:300; color:var(--ink); line-height:1.15; }
  .row svg{ width:3mm; height:3mm; color:var(--wine); flex:none; }
  .row b{ font-weight:500; }

  .right{ position:relative; z-index:1; width:31mm; flex:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4mm; padding:3mm 3.2mm 3mm 0; }
  .qr{ width:25mm; height:25mm; padding:1.5mm; background:#fff; border:.3mm solid rgba(180,150,106,.4);
    border-radius:2mm; box-shadow:0 3px 8px -4px rgba(63,24,37,.3); }
  .qr img{ width:100%; height:100%; display:block; }
  .qr-label{ font-size:1.65mm; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }

  /* ---------- screen controls ---------- */
  .toolbar{ display:flex; gap:12px; }
  .btn{ font-family:var(--sans); font-size:14px; color:#fff; background:var(--wine); border:none;
    border-radius:999px; padding:12px 26px; cursor:pointer; box-shadow:0 10px 24px -12px rgba(63,24,37,.6);
    transition:transform .25s ease, background .25s ease; }
  .btn:hover{ transform:translateY(-2px); background:var(--winedeep); }
  .hint{ font-size:12.5px; color:#4a3d33; max-width:210mm; text-align:center; line-height:1.7; }
  .hint b{ color:#3F1825; }

  @page{ size:A4 portrait; margin:0; }
  @media print{
    body{ background:#fff; padding:0; gap:0; }
    .no-print{ display:none !important; }
    .sheet{ box-shadow:none; margin:0; }
  }
</style>
</head>
<body>

  <div class="sheet" id="sheet"></div>

  <div class="toolbar no-print">
    <button class="btn" onclick="window.print()">Imprimir folha</button>
  </div>
  <p class="hint no-print">
    São <b>10 cartões de visita</b> tamanho carteira (8,5 × 5,4 cm) numa folha <b>A4</b>.<br/>
    Ao imprimir: <b>Escala 100%</b> (não “ajustar à página”), <b>margens: nenhuma</b> e ative <b>“Gráficos de plano de fundo”</b>.
  </p>

  <script>
    const card = `
      <div class="card">
        <div class="left">
          <div class="brand">
            <img src="brand/Logo_ber.png" alt="" />
            <div>
              <div class="name">Betina Bernardi Boff</div>
              <div class="role">Cirurgiã-Dentista · CRO-SC 25849</div>
            </div>
          </div>
          <div class="rule"></div>
          <div class="contacts">
            <div class="row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 1 1 16.1-3.8z"/></svg>
              <span><b>WhatsApp</b> +55 48 8863-4224</span>
            </div>
            <div class="row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
              <span>@betinaber</span>
            </div>
            <div class="row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
              <span>betinaboff.com</span>
            </div>
            <div class="row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-7-10a7 7 0 0 1 14 0c0 5.65-7 10-7 10z"/><circle cx="12" cy="11" r="2.5"/></svg>
              <span>Av. Atílio Pedro Pagani, 115 · Palhoça/SC</span>
            </div>
          </div>
        </div>
        <div class="right">
          <div class="qr"><img src="qr-code/qr-site-vinho.svg" alt="QR para o site" /></div>
          <div class="qr-label">Acesse o site</div>
        </div>
      </div>`;
    document.getElementById('sheet').innerHTML = card.repeat(10);
  </script>
</body>
</html>
